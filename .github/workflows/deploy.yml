name: Deploy to A2 Hosting
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          cd client && npm ci && npm run build && cd ..

      - name: Build backend
        run: |
          cd server && npm ci && npm run build && cd ..

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.A2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_a2
          chmod 600 ~/.ssh/id_a2
          ssh-keyscan -p ${{ secrets.A2_PORT || '7822' }} ${{ secrets.A2_HOST || 'eastafricanip.com' }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Package and deploy frontend
        run: |
          cd client/dist
          zip -r ../../deploy_frontend.zip .
          cd ../..
          scp -i ~/.ssh/id_a2 -P ${{ secrets.A2_PORT || '7822' }} -o ConnectTimeout=12 deploy_frontend.zip ${{ secrets.A2_USER || 'falolega' }}@${{ secrets.A2_HOST || 'eastafricanip.com' }}:/home/${{ secrets.A2_USER || 'falolega' }}/${{ secrets.A2_FRONTEND_DEPLOY_PATH || 'eastafricanip.com' }}/
          ssh -i ~/.ssh/id_a2 -p ${{ secrets.A2_PORT || '7822' }} -o ConnectTimeout=12 ${{ secrets.A2_USER || 'falolega' }}@${{ secrets.A2_HOST || 'eastafricanip.com' }} "
            cd /home/${{ secrets.A2_USER || 'falolega' }}/${{ secrets.A2_FRONTEND_DEPLOY_PATH || 'eastafricanip.com' }}
            if [ -d 'assets' ]; then find assets -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' -o -name '*.map' \) -delete; fi
            unzip -oq deploy_frontend.zip
            rm -f deploy_frontend.zip
          "

      - name: Package and deploy backend
        run: |
          cd server/dist
          zip -r ../../deploy_backend.zip .
          cd ../..
          cp server/package.json deploy_backend_pkg.json
          zip -j deploy_backend.zip deploy_backend_pkg.json
          if [ -f scripts/deployment/server.htaccess ]; then
            cp scripts/deployment/server.htaccess ./deploy_htaccess
            zip -j deploy_backend.zip deploy_htaccess
          fi
          scp -i ~/.ssh/id_a2 -P ${{ secrets.A2_PORT || '7822' }} -o ConnectTimeout=12 deploy_backend.zip ${{ secrets.A2_USER || 'falolega' }}@${{ secrets.A2_HOST || 'eastafricanip.com' }}:/home/${{ secrets.A2_USER || 'falolega' }}/${{ secrets.A2_BACKEND_DEPLOY_PATH || 'eastafricanip.com/api' }}/
          ssh -i ~/.ssh/id_a2 -p ${{ secrets.A2_PORT || '7822' }} -o ConnectTimeout=12 ${{ secrets.A2_USER || 'falolega' }}@${{ secrets.A2_HOST || 'eastafricanip.com' }} "
            cd /home/${{ secrets.A2_USER || 'falolega' }}/${{ secrets.A2_BACKEND_DEPLOY_PATH || 'eastafricanip.com/api' }}
            if [ -d 'uploads' ]; then rm -rf ../uploads_backup && mv uploads ../uploads_backup; fi
            if [ -d 'forms-upload' ]; then rm -rf ../forms-upload_backup && mv forms-upload ../forms-upload_backup; fi
            unzip -oq deploy_backend.zip
            if [ -d '../uploads_backup' ]; then rm -rf uploads && mv ../uploads_backup uploads; fi
            if [ -d '../forms-upload_backup' ]; then rm -rf forms-upload && mv ../forms-upload_backup forms-upload; fi
            mkdir -p uploads/marks forms-upload
            rm -f deploy_backend.zip
            mkdir -p tmp && touch tmp/restart.txt
          "
