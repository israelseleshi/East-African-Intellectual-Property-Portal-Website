name: Deploy to A2 Hosting
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build, package, and deploy
        env:
          A2_KEY: ${{ secrets.A2_SSH_KEY }}
          A2_PORT: ${{ secrets.A2_PORT || '7822' }}
          A2_HOST: ${{ secrets.A2_HOST || 'eastafricanip.com' }}
          A2_USER: ${{ secrets.A2_USER || 'falolega' }}
          A2_FE_PATH: ${{ secrets.A2_FRONTEND_DEPLOY_PATH || 'eastafricanip.com' }}
          A2_BE_PATH: ${{ secrets.A2_BACKEND_DEPLOY_PATH || 'eastafricanip.com/api' }}
        run: |
          # Build
          cd "$GITHUB_WORKSPACE/client" && npm ci && npm run build
          cd "$GITHUB_WORKSPACE/server" && npm ci && npm run build

          # Package zips at known absolute path
          cd "$GITHUB_WORKSPACE/client/dist" && zip -r "$GITHUB_WORKSPACE/deploy_frontend.zip" .
          cd "$GITHUB_WORKSPACE/server/dist" && zip -r "$GITHUB_WORKSPACE/deploy_backend.zip" .
          cd "$GITHUB_WORKSPACE"
          cp server/package.json deploy_backend_pkg.json
          zip -j "$GITHUB_WORKSPACE/deploy_backend.zip" deploy_backend_pkg.json
          if [ -f scripts/deployment/server.htaccess ]; then
            cp scripts/deployment/server.htaccess deploy_htaccess
            zip -j "$GITHUB_WORKSPACE/deploy_backend.zip" deploy_htaccess
          fi

          # Configure SSH
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$A2_KEY" | tr -d '\r' > ~/.ssh/id_a2 && chmod 600 ~/.ssh/id_a2

          # Deploy
          OPTS="-i ~/.ssh/id_a2 -p $A2_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=30"
          scp $OPTS "$GITHUB_WORKSPACE/deploy_frontend.zip" "$GITHUB_WORKSPACE/deploy_backend.zip" "$A2_USER@$A2_HOST:~/"
          ssh $OPTS "$A2_USER@$A2_HOST" "
            set -e
            cd ~/$A2_FE_PATH
            [ -d assets ] && find assets -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' -o -name '*.map' \) -delete
            mv ~/deploy_frontend.zip . && unzip -oq deploy_frontend.zip && rm -f deploy_frontend.zip
            cd ~/$A2_BE_PATH
            [ -d uploads ] && mv uploads ~/uploads_backup
            [ -d forms-upload ] && mv forms-upload ~/forms-upload_backup
            mv ~/deploy_backend.zip . && unzip -oq deploy_backend.zip && rm -f deploy_backend.zip
            [ -d ~/uploads_backup ] && rm -rf uploads && mv ~/uploads_backup uploads
            [ -d ~/forms-upload_backup ] && rm -rf forms-upload && mv ~/forms-upload_backup forms-upload
            mkdir -p uploads/marks forms-upload
            npm install --omit=dev && mkdir -p tmp && touch tmp/restart.txt
          "
