# Deploy frontend + backend to A2 Hosting via SSH
name: Deploy to A2 Hosting
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          cd client && npm ci && npm run build && cd ..

      - name: Build backend
        run: |
          cd server && npm ci && npm run build && cd ..

      - name: Package frontend
        run: |
          cd client/dist && tar czf ../../frontend.tar.gz . && cd ../..

      - name: Package backend
        run: |
          mkdir -p deploy_backend
          cp -r server/dist/* deploy_backend/
          cp server/package.json deploy_backend/
          if [ -f server.js.temp ]; then cp server.js.temp deploy_backend/server.js; fi
          if [ -f scripts/deployment/server.htaccess ]; then cp scripts/deployment/server.htaccess deploy_backend/.htaccess; fi
          mkdir -p deploy_backend/tmp && touch deploy_backend/tmp/restart.txt
          cd deploy_backend && tar czf ../backend.tar.gz . && cd ..

      - name: Deploy via rsync over SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 7822 -H ${{ secrets.FTP_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null || true

          # Copy frontend to server
          rsync -avz --delete -e "ssh -p 7822 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o KexAlgorithms=+diffie-hellman-group1-sha1 -o HostKeyAlgorithms=+ssh-rsa -o Ciphers=+aes256-cbc" \
            client/dist/ falolega@${{ secrets.FTP_SERVER }}:/home/falolega/eastafricanip.com/

          # Copy backend to server
          rsync -avz --delete -e "ssh -p 7822 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o KexAlgorithms=+diffie-hellman-group1-sha1 -o HostKeyAlgorithms=+ssh-rsa -o Ciphers=+aes256-cbc" \
            deploy_backend/ falolega@${{ secrets.FTP_SERVER }}:/home/falolega/eastafricanip.com/api/
        shell: bash
